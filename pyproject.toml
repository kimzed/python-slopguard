[project]
name = "slopguard"
version = "0.1.0"
description = "Claude Code Stop hook that blocks AI slop: complexity, long files, dead code, duplication"
readme = "README.md"
authors = [
    { name = "kimzed", email = "cedric.baron.ls@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ruff==0.16.9",
    "vulture==2.16",
]

[project.scripts]
slopguard = "slopguard.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.slopguard]
exclude = ["tests/fixtures/*"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures"]
